<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeadFlow CRM - Sign In</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div class="login-page">
    <!-- Background orbs -->
    <div style="position:absolute;top:10%;left:20%;width:300px;height:300px;background:radial-gradient(circle,rgba(0,102,255,0.12),transparent);border-radius:50%;pointer-events:none;"></div>
    <div style="position:absolute;bottom:15%;right:15%;width:200px;height:200px;background:radial-gradient(circle,rgba(0,212,170,0.1),transparent);border-radius:50%;pointer-events:none;"></div>

    <div class="login-card">
      <!-- Logo -->
      <div class="login-logo">
        <div class="logo-icon">
          <i class="fa-solid fa-bolt"></i>
        </div>
        <div class="logo-text">Lead<span>Flow</span> CRM</div>
      </div>
      <p class="login-tagline">The all-in-one marketing platform for growing businesses</p>

      <!-- Login Form -->
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="login-input-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@company.com" value="admin@leadflow.com" required>
        </div>

        <div class="login-input-group" style="position:relative;">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" value="password123" required>
          <button type="button" onclick="togglePassword()" style="position:absolute;right:12px;bottom:12px;background:none;border:none;cursor:pointer;color:#6b7280;font-size:14px;">
            <i class="fa-regular fa-eye" id="eye-icon"></i>
          </button>
        </div>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
          <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:#6b7280;cursor:pointer;">
            <input type="checkbox" checked style="accent-color:#0066ff;width:14px;height:14px;">
            Remember me
          </label>
          <a href="#" style="font-size:13px;color:#0066ff;text-decoration:none;font-weight:600;">Forgot password?</a>
        </div>

        <button type="submit" class="login-btn" id="login-btn">
          <span id="btn-text">Sign In</span>
          <span id="btn-loader" style="display:none;"><i class="fa-solid fa-spinner fa-spin"></i></span>
        </button>
      </form>

      <div class="login-footer">
        Don't have an account? <a href="#" style="color:#0066ff;font-weight:600;text-decoration:none;">Start free trial</a>
      </div>

      <div class="login-features">
        <div class="login-feature">
          <i class="fa-solid fa-check-circle"></i>
          <span>No credit card</span>
        </div>
        <div class="login-feature">
          <i class="fa-solid fa-check-circle"></i>
          <span>14-day trial</span>
        </div>
        <div class="login-feature">
          <i class="fa-solid fa-check-circle"></i>
          <span>Cancel anytime</span>
        </div>
      </div>
    </div>

    <!-- Demo hint -->
    <div style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,0.08);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.15);border-radius:10px;padding:10px 20px;color:rgba(255,255,255,0.7);font-size:12.5px;z-index:10;text-align:center;">
      <i class="fa-solid fa-info-circle" style="color:#0066ff;margin-right:6px;"></i>
      Demo: Use any email & password to sign in
    </div>
  </div>

  <script>
    function togglePassword() {
      const pwd = document.getElementById('password');
      const icon = document.getElementById('eye-icon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.className = 'fa-regular fa-eye-slash';
      } else {
        pwd.type = 'password';
        icon.className = 'fa-regular fa-eye';
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const text = document.getElementById('btn-text');
      const loader = document.getElementById('btn-loader');

      btn.disabled = true;
      text.style.display = 'none';
      loader.style.display = 'inline';
      btn.style.opacity = '0.8';

      // Simulate auth delay
      setTimeout(() => {
        localStorage.setItem('lf_auth', 'true');
        localStorage.setItem('lf_user', JSON.stringify({
          name: 'Alex Johnson',
          email: document.getElementById('email').value,
          role: 'Admin',
          avatar: 'AJ'
        }));
        window.location.href = 'app.html';
      }, 800);
    }
  </script>
</body>
</html>
